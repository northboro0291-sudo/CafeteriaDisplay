<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cafeteria Display</title>
<style>
  html,body {margin:0;padding:0;height:100%;background:black;color:white;font-family:Arial}
  iframe {width:100%;height:100%;border:none}
  #stopBtn {position:fixed;top:20px;right:20px;background:#ff4444;color:white;border:none;
            padding:10px 18px;border-radius:10px;font-size:16px;z-index:9999;cursor:pointer}
  #clock {position:fixed;top:20px;left:20px;font-size:20px;z-index:9999;background:rgba(0,0,0,0.4);
          padding:6px 10px;border-radius:8px}
</style>
</head>
<body>

<div id="clock">--:--:--</div>
<button id="stopBtn">STOP</button>
<audio id="alertSound" preload="auto" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>
<iframe id="frame"></iframe>

<script>
/* ====== CONFIGURATION ====== */
const dashboardURL = "https://docs.google.com/spreadsheets/d/10MU4_GbMkyTAWfn5vqUBmjYRbS0vad_7YNg88mGetOs/edit?gid=0";
const alertURL     = "https://docs.google.com/spreadsheets/d/10MU4_GbMkyTAWfn5vqUBmjYRbS0vad_7YNg88mGetOs/edit?gid=923860890";
const configCSV    = "PASTE_YOUR_CSV_LINK_HERE";  // <--- Replace this line
/* =========================== */

const frame = document.getElementById('frame');
const stopBtn = document.getElementById('stopBtn');
const clockDiv = document.getElementById('clock');
const alertSound = document.getElementById('alertSound');

let alertActive = false;
let showingAlert = false;
let intervalId = null;

// Clock
function updateClock() { clockDiv.textContent = new Date().toLocaleTimeString(); }
setInterval(updateClock, 1000);
updateClock();

// Basic CSV parser
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  return lines.map(l => l.split(','));
}

// Fetch config.csv and check status
async function checkStatus() {
  try {
    const res = await fetch(configCSV + "&nocache=" + Math.random());
    const text = await res.text();
    const table = parseCSV(text);
    let row = table.length >= 2 ? table[1] : table[0];  // usually 2nd line holds values
    const status = (row && row[1]) ? row[1].trim() : "";
    handleStatus(status);
  } catch (err) {
    console.error("Error fetching Config CSV:", err);
  }
}

function handleStatus(status) {
  if (status === "Running" && !alertActive) startAlert();
  else if (status !== "Running" && alertActive) stopAlert();
}

function toggleDisplay() {
  if (!alertActive) return;
  showingAlert = !showingAlert;
  frame.src = showingAlert ? alertURL : dashboardURL;
  if (showingAlert) alertSound.play().catch(() => {});
}

function startAlert() {
  if (intervalId) return;
  alertActive = true;
  showingAlert = false;
  toggleDisplay();
  intervalId = setInterval(toggleDisplay, 8000); // switch every 8 seconds
  console.log("Alert started");
}

function stopAlert() {
  alertActive = false;
  if (intervalId) { clearInterval(intervalId); intervalId = null; }
  frame.src = dashboardURL;
  console.log("Alert stopped");
}

// Local STOP button
stopBtn.onclick = () => {
  stopAlert();
};

// Check config every 5 seconds
setInterval(checkStatus, 5000);
checkStatus();
frame.src = dashboardURL;
</script>

</body>
</html>
